name: test

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  NVIM_VERSION: v0.12.6

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Optional tools; tests that need them are skipped (pending) when missing,
      # so an Ubuntu mirror outage must not block the suite.
      - name: Install optional system packages
        continue-on-error: true
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y ripgrep fd-find build-essential clangd clang-format

      - name: Install Neovim ${{ env.NVIM_VERSION }}
        run: |
          arch=$(uname -m | sed 's/aarch64/arm64/')
          curl -fsSL "https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-${arch}.tar.gz" | tar -xz -C "$HOME"
          echo "$HOME/nvim-linux-${arch}/bin" >> "$GITHUB_PATH"

      - name: Cache plugins
        uses: actions/cache@v4
        with:
          path: .tests/data/nvim/wraithvim
          key: plugins-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lazy-lock.json') }}

      - name: Install pinned plugins
        run: make deps

      - name: Tool versions
        run: |
          nvim --version | head -n1
          for t in git gcc make rg fd fdfind clangd clang-format; do printf '%-13s %s\n' "$t" "$(command -v "$t" || echo missing)"; done
          if command -v clang-format >/dev/null; then
            clang-format --version
            printf 'int main(void){return 0;}\n' | clang-format --assume-filename=main.c || true
          fi

      - name: Unit and installer tests
        run: make test-unit

      - name: Integration tests (headless and real TUI)
        run: make test-integration
