name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned StyLua, Luacheck, ShellCheck
        run: make tools
      - name: Shell syntax
        run: make syntax
      - name: Luacheck
        run: make luacheck
      - name: StyLua
        run: make format-check
      - name: ShellCheck
        run: make shellcheck
